<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PhD Europe — Funded Positions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4efe6; --bg-2:#ece5d6; --ink:#0f0d0a; --muted:#6b6455; --rule:#d6ccb8;
  --rule-strong:#1d1a14;
  --accent:#b4441e; --accent-2:#1b3a5b; --card:#fbf7ee; --chip:#e6dcc5;
  --ok:#3d7a3d; --warn:#b87f1f; --urgent:#b4441e;
  --serif:"Fraunces",Georgia,serif; --sans:"Inter",system-ui,sans-serif;
  --pad:clamp(1rem,2vw,2.25rem);
  --shadow-sm:0 1px 2px rgba(15,13,10,.04),0 2px 6px rgba(15,13,10,.04);
  --shadow-md:0 6px 18px rgba(15,13,10,.08),0 2px 6px rgba(15,13,10,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","cv11";}
body{background-image:radial-gradient(circle at 1px 1px, rgba(15,13,10,.04) 1px, transparent 0);background-size:24px 24px}
a{color:inherit}
::selection{background:var(--ink);color:var(--bg)}
header{border-bottom:1px solid var(--rule-strong);padding:calc(var(--pad) * .9) var(--pad);background:var(--bg);position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:4px;border-top:1px solid var(--rule-strong);pointer-events:none}
.masthead{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;flex-wrap:wrap;max-width:1400px;margin:0 auto}
.brand{font-family:var(--serif);font-weight:800;font-size:clamp(1.9rem,3vw,2.8rem);letter-spacing:-0.03em;line-height:.95;font-variation-settings:"opsz" 144}
.brand span{color:var(--accent);font-style:italic;font-weight:400}
.meta{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.18em;font-weight:500}
main{max-width:1400px;margin:0 auto;padding:calc(var(--pad) * 1.5) var(--pad)}
.crumbs{display:flex;align-items:center;gap:.55rem;font-size:.82rem;color:var(--muted);margin-bottom:1.6rem;flex-wrap:wrap;text-transform:uppercase;letter-spacing:.1em}
.crumbs button{background:none;border:0;color:var(--accent);cursor:pointer;font-family:var(--sans);font-size:.82rem;padding:0;text-decoration:none;letter-spacing:inherit;text-transform:inherit;border-bottom:1px solid transparent;transition:border-color .2s}
.crumbs button:hover{border-color:var(--accent)}
.crumbs .sep{color:var(--rule-strong);opacity:.4}
.crumbs .current{color:var(--ink);font-weight:600}
.view-title{font-family:var(--serif);font-size:clamp(2rem,4vw,3.2rem);font-weight:600;margin:0 0 2rem;letter-spacing:-0.025em;line-height:1.05;font-variation-settings:"opsz" 144}
.view-title em{color:var(--accent);font-style:italic;font-weight:400}
.grid{display:grid;gap:1.1rem;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.tile{background:var(--card);border:1px solid var(--rule);padding:1.6rem 1.6rem 1.4rem;cursor:pointer;transition:transform .25s cubic-bezier(.2,.9,.3,1.2),box-shadow .25s,border-color .25s;position:relative;text-align:left;font-family:inherit;color:inherit;width:100%;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);transform:scaleY(0);transform-origin:bottom;transition:transform .3s cubic-bezier(.2,.9,.3,1.2)}
.tile:hover{transform:translateY(-4px);box-shadow:var(--shadow-md);border-color:var(--rule-strong)}
.tile:hover::before{transform:scaleY(1);transform-origin:top}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile .flag{font-size:2.2rem;margin-bottom:.75rem;filter:saturate(1.1)}
.tile h3{font-family:var(--serif);font-size:1.35rem;font-weight:600;margin:0 0 .4rem;line-height:1.2;letter-spacing:-0.015em}
.tile .sub{font-size:.76rem;color:var(--muted);margin-bottom:1rem;text-transform:uppercase;letter-spacing:.08em;font-weight:500}
.tile .count{font-family:var(--serif);font-size:2.4rem;font-weight:700;color:var(--ink);line-height:1;letter-spacing:-0.03em;font-variation-settings:"opsz" 144}
.tile .count small{font-size:.68rem;color:var(--muted);font-weight:500;margin-left:.55rem;letter-spacing:.12em;text-transform:uppercase;font-family:var(--sans)}
.tile .arrow{position:absolute;top:1.4rem;right:1.4rem;color:var(--muted);font-size:1.3rem;transition:transform .25s,color .25s}
.tile:hover .arrow{transform:translateX(4px);color:var(--accent)}
.tile img{border-radius:4px}
.jobs{display:grid;gap:.7rem}
.job-card{background:var(--card);border:1px solid var(--rule);padding:1.1rem 1.3rem 1.15rem;cursor:pointer;transition:transform .2s cubic-bezier(.2,.9,.3,1.2),box-shadow .2s,border-color .2s;position:relative}
.job-card:hover{transform:translateX(3px);box-shadow:var(--shadow-sm);border-color:var(--rule-strong)}
.job-card::before{content:"";position:absolute;left:-1px;top:-1px;bottom:-1px;width:3px;background:var(--accent);opacity:0;transition:opacity .2s}
.job-card:hover::before{opacity:1}
.job-card h3{font-family:var(--serif);font-size:1.15rem;font-weight:600;margin:0 0 .35rem;line-height:1.3;letter-spacing:-0.01em}
.job-card .m-row{font-size:.76rem;color:var(--muted);display:flex;gap:1.25rem;flex-wrap:wrap;align-items:center}
.job-card .m-row b{color:var(--ink);font-weight:600}
.job-card .tags{margin-top:.55rem;display:flex;gap:.35rem;flex-wrap:wrap}
.tag{font-size:.66rem;padding:.18rem .5rem;background:var(--chip);color:var(--ink);text-transform:uppercase;letter-spacing:.08em;font-weight:600;border-radius:2px}
.deadline-pill{display:inline-block;padding:.1rem .5rem;font-size:.68rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border-radius:2px;margin-left:.3rem}
.deadline-pill.ok{background:rgba(61,122,61,.12);color:var(--ok)}
.deadline-pill.warn{background:rgba(184,127,31,.15);color:var(--warn)}
.deadline-pill.urgent{background:rgba(180,68,30,.14);color:var(--urgent)}
.modes{display:inline-flex;gap:0;margin-bottom:1.4rem;border:1px solid var(--rule-strong);padding:3px;background:var(--bg-2)}
.mode{padding:.5rem 1rem;border:0;background:transparent;cursor:pointer;font-family:var(--sans);font-size:.76rem;text-transform:uppercase;letter-spacing:.1em;font-weight:600;color:var(--muted);transition:background .2s,color .2s}
.mode.on{background:var(--ink);color:var(--bg)}
.mode:not(.on):hover{color:var(--ink)}
.search-wrap{margin-bottom:1.6rem;position:relative;max-width:480px}
.search{width:100%;padding:.75rem 1rem .75rem 2.4rem;border:1px solid var(--rule);background:var(--card);font-family:var(--sans);font-size:.92rem;transition:border-color .2s,box-shadow .2s}
.search:focus{outline:0;border-color:var(--rule-strong);box-shadow:var(--shadow-sm)}
.search-wrap::before{content:"⌕";position:absolute;left:.9rem;top:50%;transform:translateY(-50%);color:var(--muted);font-size:1.05rem;pointer-events:none}
.empty{padding:4rem 1rem;text-align:center;color:var(--muted);border:1px dashed var(--rule-strong);font-family:var(--serif);font-style:italic;font-size:1.05rem;background:var(--card)}
.overlay{position:fixed;inset:0;background:rgba(22,20,15,.5);display:none;z-index:50;align-items:flex-start;justify-content:center;padding:2rem;overflow-y:auto}
.overlay.on{display:flex}
.detail{background:var(--card);max-width:760px;width:100%;border:1px solid var(--ink);padding:clamp(1.5rem,3vw,2.5rem);position:relative}
.detail .close{position:absolute;top:.5rem;right:.8rem;background:none;border:0;font-size:1.6rem;cursor:pointer;font-family:var(--serif)}
.detail h2{font-family:var(--serif);font-size:clamp(1.6rem,3vw,2.2rem);font-weight:600;margin:0 0 .3rem;line-height:1.2;padding-right:2rem}
.detail .d-inst{font-size:1rem;color:var(--muted);margin-bottom:1rem;border-bottom:1px solid var(--rule);padding-bottom:1rem}
.detail .d-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.8rem;margin-bottom:1.4rem;font-size:.85rem}
.detail .d-meta div b{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:.15rem;font-weight:500}
.detail .desc{font-family:var(--serif);font-size:1.02rem;line-height:1.65;margin-bottom:1.5rem}
.detail .desc:empty::before{content:"No description cached.";color:var(--muted);font-style:italic}
.detail .desc h2,.detail .desc h3{font-family:var(--serif);font-size:1.15rem;font-weight:600;margin:1.4rem 0 .5rem}
.detail .desc p{margin:0 0 .85rem}
.detail .desc ul,.detail .desc ol{margin:.4rem 0 1rem;padding-left:1.3rem}
.detail .desc li{margin-bottom:.3rem}
.detail .desc a{color:var(--accent);text-decoration:underline}
.contacts{border-top:1px solid var(--rule);padding-top:1rem;margin-bottom:1.2rem;font-size:.88rem}
.contacts h4{font-family:var(--serif);font-size:.95rem;font-weight:600;margin:0 0 .5rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.contacts .c-row{margin-bottom:.35rem}
.source-link{border-top:1px solid var(--rule);padding-top:1rem;font-size:.82rem;color:var(--muted);word-break:break-all}
.source-link a{color:var(--accent);text-decoration:underline}
footer{border-top:1px solid var(--rule);padding:var(--pad);font-size:.75rem;color:var(--muted);text-align:center;max-width:1400px;margin:0 auto}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:.3rem;vertical-align:middle}
.auth-btn{flex-basis:100%;display:flex;justify-content:flex-end;align-items:center;gap:.6rem;margin-top:.4rem}
.auth-btn button{background:var(--ink);color:var(--bg);border:0;padding:.4rem .9rem;font-family:var(--sans);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.lang-toggle{background:transparent!important;color:var(--ink)!important;border:1px solid var(--rule-strong)!important;font-weight:600;padding:.35rem .7rem!important}
.lang-toggle:hover{background:var(--ink)!important;color:var(--bg)!important}
footer a.legal-link{color:var(--accent);text-decoration:underline;cursor:pointer;margin:0 .3rem}
.legal-doc{font-family:var(--serif);line-height:1.7}
.legal-doc h3{font-size:1.1rem;font-weight:600;margin:1.2rem 0 .4rem}
.legal-doc p{margin:0 0 .7rem}
.auth-btn .user-email{font-size:.78rem;color:var(--muted);margin-right:.6rem}
.fav-btn{position:absolute;top:.8rem;right:.9rem;background:none;border:0;font-size:1.2rem;cursor:pointer;color:var(--muted);padding:.2rem}
.fav-btn.on{color:var(--accent)}
.job-card{position:relative}
.auth-form{display:flex;flex-direction:column;gap:.6rem}
.auth-form input{padding:.55rem .7rem;border:1px solid var(--rule);background:transparent;font-family:var(--sans);font-size:.9rem}
.auth-form .row{display:flex;gap:.5rem}
.auth-form button{flex:1;padding:.55rem;background:var(--ink);color:var(--bg);border:0;font-family:var(--sans);font-size:.82rem;text-transform:uppercase;letter-spacing:.08em;cursor:pointer}
.auth-form button.secondary{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.auth-msg{font-size:.8rem;color:var(--accent);min-height:1rem}
/* gate removed — site is publicly accessible during beta */

/* ===== Urgent badge on tiles ===== */
.tile .urgent-badge{position:absolute;top:1.4rem;right:3.2rem;background:var(--urgent);color:#fff;font-size:.62rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.22rem .5rem;border-radius:2px;display:flex;align-items:center;gap:.3rem}
.tile .urgent-badge::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ===== Jobs toolbar (sort + urgent filter) ===== */
.toolbar{display:flex;gap:.6rem;align-items:center;margin-bottom:1.1rem;flex-wrap:wrap;font-size:.78rem}
.toolbar label{color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.toolbar select{padding:.4rem .7rem;border:1px solid var(--rule);background:var(--card);font-family:var(--sans);font-size:.82rem;cursor:pointer}
.toolbar select:focus{outline:0;border-color:var(--rule-strong)}
.toolbar .urgent-toggle{padding:.4rem .8rem;border:1px solid var(--rule);background:var(--card);cursor:pointer;font-family:var(--sans);font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:.4rem;transition:all .2s}
.toolbar .urgent-toggle:hover{color:var(--ink);border-color:var(--rule-strong)}
.toolbar .urgent-toggle.on{background:var(--urgent);color:#fff;border-color:var(--urgent)}
.toolbar .urgent-toggle::before{content:"●";font-size:.7rem}
.toolbar .count-label{margin-left:auto;color:var(--muted);font-style:italic;font-family:var(--serif);font-size:.9rem}

/* ===== Public hero (replaces former gate) ===== */
#hero{max-width:1200px;margin:clamp(1.5rem,3vw,3rem) auto 2rem;padding:0 var(--pad);text-align:left}
.hero-wrap{display:grid;grid-template-columns:1.3fr 1fr;gap:clamp(1.5rem,4vw,4rem);align-items:center;margin-bottom:2rem}
@media (max-width:820px){.hero-wrap{grid-template-columns:1fr}}
.hero-left h1{font-family:var(--serif);font-size:clamp(2rem,5vw,4rem);font-weight:800;letter-spacing:-0.035em;line-height:1;margin:0 0 1.2rem;font-variation-settings:"opsz" 144}
.hero-left h1 em{color:var(--accent);font-style:italic;font-weight:400;display:inline-block;position:relative}
.hero-left h1 em::after{content:"";position:absolute;left:0;right:0;bottom:-.15em;height:3px;background:var(--accent);opacity:.3}
.hero-left p{font-family:var(--serif);font-size:clamp(.95rem,1.3vw,1.1rem);line-height:1.55;color:var(--ink);margin:0 0 1.2rem;max-width:52ch;opacity:.78}
.hero-badge{display:inline-block;font-family:var(--sans);font-size:.7rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--urgent);border:1px solid var(--urgent);padding:.35rem .7rem;border-radius:2px}
.hero-right{border-left:1px solid var(--rule-strong);padding-left:clamp(1rem,3vw,2.5rem);position:relative}
.hero-right::before{content:"Live";position:absolute;left:-1px;top:-.5rem;background:var(--bg);color:var(--urgent);padding:0 .5rem 0 0;font-size:.66rem;text-transform:uppercase;letter-spacing:.2em;font-weight:700}
.gate-stat-block{margin-bottom:1.4rem}
.gate-stat-block .num{font-family:var(--serif);font-size:clamp(2.5rem,4.5vw,4rem);font-weight:800;line-height:1;letter-spacing:-0.03em;font-variation-settings:"opsz" 144}
.gate-stat-block .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.15em;color:var(--muted);font-weight:600;margin-top:.3rem}
.gate-stat-block.split{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.gate-stat-block.split .num{font-size:clamp(1.4rem,2.5vw,2rem)}

.gate-ticker{margin-top:2rem;padding:1.5rem 0;border-top:1px solid var(--rule-strong);border-bottom:1px solid var(--rule-strong);overflow:hidden;position:relative}
.gate-ticker::before,.gate-ticker::after{content:"";position:absolute;top:0;bottom:0;width:80px;z-index:2;pointer-events:none}
.gate-ticker::before{left:0;background:linear-gradient(to right,var(--bg),transparent)}
.gate-ticker::after{right:0;background:linear-gradient(to left,var(--bg),transparent)}
.ticker-track{display:flex;gap:3rem;animation:scroll-x 60s linear infinite;width:max-content}
.ticker-track:hover{animation-play-state:paused}
.ticker-item{display:flex;align-items:center;gap:.7rem;white-space:nowrap;font-family:var(--serif);font-size:.95rem;font-style:italic;color:var(--muted)}
.ticker-item img{width:28px;height:28px;object-fit:contain;opacity:.9}
@keyframes scroll-x{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ticker-track{animation:none}}

/* ===== Redesigned detail overlay ===== */
.detail .d-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem}
.detail .d-head .d-fav{background:none;border:1px solid var(--rule);padding:.45rem .8rem;cursor:pointer;font-family:var(--sans);font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:.4rem;transition:all .2s;white-space:nowrap}
.detail .d-head .d-fav.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.detail .d-head .d-fav:hover{border-color:var(--rule-strong);color:var(--ink)}
.detail .d-head .d-fav.on:hover{color:#fff}
.detail .d-head h2{flex:1;padding-right:0;margin:0}
.detail .countdown{background:var(--bg-2);border-left:3px solid var(--accent);padding:1rem 1.2rem;margin-bottom:1.4rem;display:flex;align-items:baseline;gap:.8rem;flex-wrap:wrap}
.detail .countdown.urgent{border-left-color:var(--urgent);background:rgba(180,68,30,.08)}
.detail .countdown.warn{border-left-color:var(--warn);background:rgba(184,127,31,.08)}
.detail .countdown .big{font-family:var(--serif);font-size:2.6rem;font-weight:800;line-height:1;letter-spacing:-0.03em;font-variation-settings:"opsz" 144}
.detail .countdown.urgent .big{color:var(--urgent)}
.detail .countdown.warn .big{color:var(--warn)}
.detail .countdown .lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.detail .countdown .date{margin-left:auto;font-family:var(--serif);font-style:italic;color:var(--muted);font-size:.95rem}
.detail .d-meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0;margin-bottom:1.5rem;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.detail .d-meta-grid .cell{padding:.9rem 1rem;border-right:1px solid var(--rule)}
.detail .d-meta-grid .cell:last-child{border-right:0}
.detail .d-meta-grid .cell b{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:.25rem;font-weight:600}
.detail .d-meta-grid .cell .val{font-family:var(--serif);font-size:1rem;font-weight:600}

/* === Europe map section === */
#europe-map-section{padding:calc(var(--pad)*1.2) var(--pad);background:var(--bg-2);border-bottom:1px solid var(--rule-strong)}
.map-head{max-width:1400px;margin:0 auto 1.2rem;display:flex;align-items:baseline;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.map-head h2{font-family:var(--serif);font-weight:800;font-size:clamp(1.6rem,2.4vw,2.4rem);letter-spacing:-0.02em;margin:0;font-variation-settings:"opsz" 144}
.map-head .map-hint{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:.95rem}
.map-wrap{position:relative;max-width:1200px;margin:0 auto;background:var(--card);border:1px solid var(--rule-strong);box-shadow:var(--shadow-md)}
#europe-map{display:block;width:100%;height:auto;min-height:520px;background:linear-gradient(180deg,var(--card),var(--bg-2))}
#europe-map path{transition:fill .15s,stroke-width .15s;stroke:var(--bg);stroke-width:.6;stroke-linejoin:round}
#europe-map path.has-jobs{cursor:pointer}
#europe-map path.has-jobs:hover{stroke:var(--rule-strong);stroke-width:1.2}
#europe-map path.selected{stroke:var(--ink);stroke-width:1.8}
#map-tooltip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:.4rem .65rem;font-size:.78rem;font-family:var(--sans);border-radius:2px;white-space:nowrap;opacity:0;transition:opacity .12s;z-index:5;transform:translate(-50%,-120%)}
#map-tooltip.show{opacity:1}
#map-tooltip b{font-family:var(--serif);font-weight:600}
#map-legend{display:flex;align-items:center;gap:.5rem;padding:.55rem .8rem;font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;border-top:1px solid var(--rule)}
#map-legend .swatches{display:inline-flex;gap:1px}
#map-legend .sw{width:18px;height:10px}
.map-panel{background:var(--card);border:1px solid var(--rule-strong);box-shadow:var(--shadow-sm);padding:1rem 1.25rem;max-height:560px;overflow:auto}
.map-panel h3{font-family:var(--serif);font-weight:700;margin:0 0 .25rem;font-size:1.15rem;letter-spacing:-.01em}
.map-panel .panel-sub{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:.9rem}
.map-panel ul{list-style:none;padding:0;margin:0}
.map-panel li{padding:.65rem 0;border-top:1px solid var(--rule)}
.map-panel li:first-child{border-top:0}
.map-panel li a{display:block;font-family:var(--serif);font-weight:600;font-size:.98rem;line-height:1.3;text-decoration:none;color:var(--ink)}
.map-panel li a:hover{color:var(--accent)}
.map-panel li small{display:block;font-size:.74rem;color:var(--muted);margin-top:.2rem}
.map-panel .panel-empty{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:.95rem;padding:1.5rem 0}

function countryName(cc){ return state.lang==="zh" ? (COUNTRY_NAMES_ZH[cc]||COUNTRY_NAMES[cc]||cc) : (COUNTRY_NAMES[cc]||cc); }
function applyStatic(){
  document.documentElement.lang = state.lang==="zh" ? "zh-CN" : "en";
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.innerHTML = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>{ el.placeholder = t(el.dataset.i18nPh); });
  const lt = document.getElementById("lang-toggle");
  if(lt) lt.textContent = state.lang==="zh" ? "EN" : "中";
}
function setLang(l){ state.lang=l; localStorage.setItem("phdLang",l); applyStatic(); render(); load(); }

function esc(s){ return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(s){ return s || "—"; }
function daysTo(s){
  // Compare both as local-midnight to avoid timezone-induced "-1" flicker.
  if(!s) return null;
  const d = new Date(s+"T00:00:00");
  const t = new Date(); t.setHours(0,0,0,0);
  return Math.round((d-t)/86400000);
}

async function load(){

// === Europe map: fetch GeoJSON once, render, attach click/hover ===
const MAP_GEO_URL = "https://cdn.jsdelivr.net/gh/leakyMirror/map-of-europe@master/GeoJSON/europe.geojson";
let _mapGeo = null;
let _mapSelected = null;

async function initEuropeMap(){
  const svg = document.getElementById("europe-map");
  if(!svg) return;
  if(!_mapGeo){
    try{
      const r = await fetch(MAP_GEO_URL,{cache:"force-cache"});
      _mapGeo = await r.json();
    }catch(e){
      svg.innerHTML = '<text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" fill="#888" font-size="14" font-style="italic">Map unavailable — use the country list below.</text>';
      return;
    }
  }
  const counts = {};
  state.jobs.forEach(j => { const c=j.country; if(c) counts[c]=(counts[c]||0)+1; });
  const maxN = Math.max(1, ...Object.values(counts));

  // Equirectangular projection clipped to Europe.
  const W=800, H=720;
  const minLon=-25, maxLon=42, minLat=34, maxLat=72;
  const proj = ([lon,lat]) => {
    const x = ((lon-minLon)/(maxLon-minLon))*W;
    const y = H - ((lat-minLat)/(maxLat-minLat))*H;
    return [x.toFixed(1), y.toFixed(1)];
  };
  const ringPath = (ring) =>
    "M" + ring.map(p => proj(p).join(",")).join("L") + "Z";
  const featPath = (geom) => {
    if(geom.type==="Polygon") return geom.coordinates.map(ringPath).join("");
    if(geom.type==="MultiPolygon") return geom.coordinates.flatMap(poly => poly.map(ringPath)).join("");
    return "";
  };
  const fillFor = (n) => {
    if(!n) return "#ece5d6";
    // accent (#b4441e) at varying opacity using log scale
    const t = Math.log(1+n) / Math.log(1+maxN);
    const alpha = 0.18 + 0.72*t;
    return `rgba(180,68,30,${alpha.toFixed(3)})`;
  };

  svg.innerHTML = "";
  _mapGeo.features.forEach(f => {
    const iso = f.properties.ISO2;
    const name = f.properties.NAME || iso;
    const n = counts[iso] || 0;
    const path = document.createElementNS("http://www.w3.org/2000/svg","path");
    path.setAttribute("d", featPath(f.geometry));
    path.setAttribute("fill", fillFor(n));
    path.dataset.country = iso;
    path.dataset.name = name;
    path.dataset.count = n;
    if(n>0) path.classList.add("has-jobs");
    path.addEventListener("mousemove", _mapTooltipMove);
    path.addEventListener("mouseleave", _mapTooltipHide);
    if(n>0) path.addEventListener("click", () => _selectCountry(iso, name, path));
    svg.appendChild(path);
  });

  // Legend swatches
  const sw = document.getElementById("map-swatches");
  if(sw){
    sw.innerHTML = "";
    [1,3,8,20,50].forEach(n => {
      const span = document.createElement("span");
      span.className = "sw";
      span.style.background = fillFor(n);
      sw.appendChild(span);
    });
  }
}

function _mapTooltipMove(e){
  const tt = document.getElementById("map-tooltip");
  if(!tt) return;
  const wrap = tt.parentElement.getBoundingClientRect();
  const name = e.currentTarget.dataset.name;
  const n = +e.currentTarget.dataset.count;
  const label = state.lang==="zh" ? "个岗位" : (n===1?"position":"positions");
  tt.innerHTML = `<b>${esc(name)}</b> · ${n} ${label}`;
  tt.style.left = (e.clientX - wrap.left) + "px";
  tt.style.top  = (e.clientY - wrap.top)  + "px";
  tt.classList.add("show");
}
function _mapTooltipHide(){
  const tt = document.getElementById("map-tooltip");
  if(tt) tt.classList.remove("show");
}

function _selectCountry(iso, name, pathEl){
  if(_mapSelected) _mapSelected.classList.remove("selected");
  pathEl.classList.add("selected");
  _mapSelected = pathEl;
  // Drive the existing country browse view, then scroll there
  if(typeof setMode === "function") setMode("country");
  if(typeof goCountry === "function") goCountry(iso);
  const main = document.querySelector("main");
  if(main) main.scrollIntoView({behavior:"smooth", block:"start"});
}

async function loadStats(){
  const el = document.getElementById("src-health");
  if(!el) return;
  try{
    const r = await fetch("./data/stats.json",{cache:"no-store"});
    if(!r.ok) return;
    const s = await r.json();
    const alerts = Array.isArray(s.alerts) ? s.alerts : [];
    const bySrc = s.by_source || {};
    const lines = Object.entries(bySrc).map(([k,v])=>`${k}: ${v}`).join("\n");
    if(alerts.length){
      el.style.display = "block";
      el.style.color = "var(--urgent,#c00)";
      el.textContent = (state.lang==="zh" ? "⚠ 数据源告警 " : "⚠ source alerts ") + alerts.length;
      el.title = alerts.join("\n") + "\n\n" + lines;
    } else {
      el.style.display = "block";
      el.style.color = "var(--muted)";
      el.textContent = (state.lang==="zh" ? "● " : "● ") + Object.keys(bySrc).length + (state.lang==="zh" ? " 个数据源正常" : " sources healthy");
      el.title = lines;
    }
  }catch(e){ /* stats is advisory; ignore */ }
}

function goTop(){ state.level="top"; state.country=null; state.institution=null; state.subject=null; state.q=""; render(); }
function goCountry(cc){ state.level="schools"; state.country=cc; state.institution=null; state.q=""; render(); }
function goSchool(inst){ state.level="jobs"; state.institution=inst; state.q=""; render(); }

function renderCrumbs(){
  const c = document.getElementById("crumbs");
  const topLabel = state.mode==="subject" ? t("allSubjects") : t("allCountries");
  const parts = [`<button data-nav="top">${topLabel}</button>`];

    if(state.country){

    }

function sortAndFilter(arr){
  let out = state.urgentOnly ? arr.filter(j=>{const d=daysTo(j.deadline);return d!==null&&d>=0&&d<=7;}) : arr;
  const cmp = {
    deadline:(x,y)=>(x.deadline||"9999")<(y.deadline||"9999")?-1:1,
    posted:(x,y)=>(y.posted||"")<(x.posted||"")?-1:1,
    urgent:(x,y)=>{
      const dx=daysTo(x.deadline), dy=daysTo(y.deadline);
      const rx = dx===null?99999:dx<0?99998:dx;
      const ry = dy===null?99999:dy<0?99998:dy;
      return rx-ry;
    }
  }[state.sort] || (()=>0);
  return [...out].sort(cmp);
}
function renderToolbar(totalCount){
  const urgentCount = state.jobs.filter(j=>{
    const d=daysTo(j.deadline); return d!==null&&d>=0&&d<=7;
  }).length;
  return `<div class="toolbar">
    <label for="sort-sel">${t("sortLabel")}</label>
    <select id="sort-sel">
      <option value="deadline"${state.sort==="deadline"?" selected":""}>${t("sortDeadline")}</option>
      <option value="urgent"${state.sort==="urgent"?" selected":""}>${t("sortUrgent")}</option>
      <option value="posted"${state.sort==="posted"?" selected":""}>${t("sortPosted")}</option>
    </select>
    <button class="urgent-toggle ${state.urgentOnly?'on':''}" id="urgent-tgl">${t("closingThisWeek")}</button>
    <span class="count-label">${totalCount} ${t("positionsUnit")}</span>
  </div>`;
}
function wireToolbar(){
  const sel = document.getElementById("sort-sel");

  if(sel) sel.addEventListener("change",e=>{ state.sort=e.target.value; render(); });

}

    document.getElementById("lang-toggle").onclick = ()=>setLang(state.lang==="zh"?"en":"zh");
  } else {
    authBtn.innerHTML = `<button class="lang-toggle" id="lang-toggle">${state.lang==="zh"?"EN":"中"}</button><button id="sign-in-btn">${t("signIn")}</button>`;
    document.getElementById("sign-in-btn").onclick = ()=>{ setAuthMode("signin"); authOverlay.classList.add("on"); };
    document.getElementById("lang-toggle").onclick = ()=>setLang(state.lang==="zh"?"en":"zh");
  }
}
// gate-signup / gate-signin buttons removed with gate. Header sign-in still available.
function setAuthMode(m){
  authMode = m;
  authTitle.textContent = m==="signin" ? t("signIn") : t("createAccount");
  authSubmit.textContent = m==="signin" ? t("signIn") : t("createAccount");
  authToggle.textContent = m==="signin" ? t("createAccount") : t("signIn");
  authMsg.textContent = "";
}
authToggle.onclick = ()=>setAuthMode(authMode==="signin"?"signup":"signin");
document.getElementById("auth-close").onclick = ()=>authOverlay.classList.remove("on");
authOverlay.addEventListener("click",e=>{ if(e.target.id==="auth-overlay") authOverlay.classList.remove("on"); });
authForm.addEventListener("submit", async e=>{
  e.preventDefault();
  const email = document.getElementById("auth-email").value.trim();
  const password = document.getElementById("auth-password").value;
  authMsg.textContent = "…";
  const { error } = authMode==="signin"
    ? await sb.auth.signInWithPassword({email,password})
    : await sb.auth.signUp({email,password});
  if(error){ authMsg.textContent = error.message; return; }
  authMsg.textContent = authMode==="signup" ? "Check your email to confirm." : "Signed in.";
  if(authMode==="signin") authOverlay.classList.remove("on");
});

async function loadFavorites(){
  auth.favorites = new Set();
  if(!auth.user) return;
  const { data } = await sb.from("favorites").select("job_url").eq("user_id", auth.user.id);
  if(data) data.forEach(r=>auth.favorites.add(r.job_url));
}
async function toggleFavorite(j){
  if(!auth.user){ authOverlay.classList.add("on"); return; }
  const url = j.source_url;
  if(auth.favorites.has(url)){
    await sb.from("favorites").delete().eq("user_id", auth.user.id).eq("job_url", url);
    auth.favorites.delete(url);
  } else {
    await sb.from("favorites").insert({ user_id:auth.user.id, job_url:url, title:j.title, institution:j.institution, country:j.country, deadline:j.deadline||null });
    auth.favorites.add(url);
  }
  render();
}
document.addEventListener("click", e=>{
  const b = e.target.closest(".fav-btn");
  if(!b) return;
  e.stopPropagation();
  const i = +b.dataset.i;
  toggleFavorite(state.jobs[i]);
});

// Legal modal
const legalOverlay = document.getElementById("legal-overlay");
document.getElementById("legal-close").onclick = ()=>legalOverlay.classList.remove("on");
legalOverlay.addEventListener("click",e=>{ if(e.target.id==="legal-overlay") legalOverlay.classList.remove("on"); });
document.querySelectorAll(".legal-link").forEach(a=>a.addEventListener("click",()=>{
  const k = a.dataset.legal;
  document.getElementById("legal-title").textContent = t(k+"Title");
  document.getElementById("legal-body").innerHTML = t(k+"Body");
  legalOverlay.classList.add("on");
}));

// Initial language toggle wire-up (header button present on load)
document.getElementById("lang-toggle").onclick = ()=>setLang(state.lang==="zh"?"en":"zh");
applyStatic();

sb.auth.onAuthStateChange(async (_ev, session)=>{
  auth.user = session?.user || null;
  renderAuthBtn();
  await loadFavorites();
  render();
});
sb.auth.getSession().then(async ({data})=>{
  auth.user = data.session?.user || null;
  renderAuthBtn();
  await loadFavorites();
  render();
});

load();
</script>
</body>
</html>
